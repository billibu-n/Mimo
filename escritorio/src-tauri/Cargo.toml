[package]
# El nombre del paquete da el nombre del binario: `target/release/mimo`.
name = "mimo"
version = "1.2.0-beta.1"
edition = "2021"
description = "Mimo para escritorio (Tauri 2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# El caparazon abre la ventana, sirve el frontend y expone un solo puente HTTP nativo
# (`http_pedir`, reqwest) para que WebDAV no dependa del CORS del WebView.
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# Dialogo nativo de carpetas: WebKitGTK no tiene File System Access.
tauri-plugin-dialog = "2"
gtk = "0.18"
gdk-pixbuf = "0.18"

[profile.release]
# Sin esto, el caparazon se quedaria sin optimizar: funciona, pero arranca y responde mas lento
# sin ninguna ganancia. Se compila mas lento; el binario, menos. (Medido en el molde del viejo.)
opt-level = 3
