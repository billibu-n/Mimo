[package]
# El nombre del paquete da el nombre del binario: `target/release/mimo`.
name = "mimo"
version = "1.2.0-beta.4"
edition = "2021"
description = "Mimo para escritorio (Tauri 2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# El caparazon abre la ventana, sirve el frontend y expone un solo puente HTTP nativo
# (`http_pedir`, reqwest) para que WebDAV no dependa del CORS del WebView.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
# Dialogo nativo de carpetas: WebKitGTK no tiene File System Access.
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Solo Linux: permite desactivar el limite interno de WebKitGTK que acerca la pagina a 60 fps.
webkit2gtk = "2.0"
# La carga es dinamica: Ubuntu no exporta los simbolos privados que si tiene Fedora.
libloading = "0.8"

[profile.release]
# Sin esto, el caparazon se quedaria sin optimizar: funciona, pero arranca y responde mas lento
# sin ninguna ganancia. Se compila mas lento; el binario, menos. (Medido en el molde del viejo.)
opt-level = 3
