name: Idea
description: Proponer una mejora o un bloque nuevo
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo se vería en la app y qué datos necesitaría.
    validations:
      required: true
  - type: checkboxes
    id: alcance
    attributes:
      label: Alcance
      options:
        - label: Funciona sin conexión
        - label: No requiere una cuenta ni un servidor propio
        - label: Se puede desinstalar sin borrar los datos existentes
