name: Error
description: Algo no funciona en Mimo
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        No incluyas credenciales, datos personales ni respaldos reales.
        Para problemas de seguridad usa Security → Report a vulnerability.
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: 1.2.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Fedora / RHEL (RPM)
        - Debian / Ubuntu (DEB)
        - Arch Linux
        - Windows 10/11
        - Otro
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. Abrir...\n2. Presionar...\n3. Ver..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Contexto adicional
      description: Capturas sin datos personales, mensajes de error, etc.
