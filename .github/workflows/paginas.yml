name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la versión publicada
        run: |
          test -f app/index.html
          version=$(sed -n 's/.*MIMO_VERSION = "\([^"]*\)".*/\1/p' app/js/version.js)
          test -n "$version"
          grep -q "v$version" app/index.html
          echo "Versión publicada: $version"

      - uses: actions/configure-pages@v5

      - name: Preparar el artefacto
        run: |
          touch app/.nojekyll
          test -s app/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: desplegar
        uses: actions/deploy-pages@v4
