name: Empaquetar

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: empaquetar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (deb + rpm)
    runs-on: ubuntu-24.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio/src-tauri

      - name: Dependencias de Tauri y empaquetado
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev rpm

      - name: Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.0

      - name: Construir DEB y RPM
        working-directory: escritorio
        run: tauri build --bundles deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-rpm
          if-no-files-found: error
          path: |
            escritorio/src-tauri/target/release/bundle/deb/*.deb
            escritorio/src-tauri/target/release/bundle/deb/*.deb.sig
            escritorio/src-tauri/target/release/bundle/rpm/*.rpm
            escritorio/src-tauri/target/release/bundle/rpm/*.rpm.sig

  windows:
    name: Windows (NSIS x64)
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio/src-tauri

      - name: Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.0

      - name: Construir instalador NSIS
        working-directory: escritorio
        run: tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-x64
          if-no-files-found: error
          path: |
            escritorio/src-tauri/target/release/bundle/nsis/*.exe
            escritorio/src-tauri/target/release/bundle/nsis/*.exe.sig

  arch:
    name: Arch (PKGBUILD)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Construir paquete en Arch
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            archlinux:latest \
            bash -lc '
              set -e
              pacman -Syu --noconfirm --needed base-devel git rust cargo python pkgconf \
                webkit2gtk-4.1 gtk3 libsoup3 openssl cairo pango gdk-pixbuf2 \
                at-spi2-atk librsvg hicolor-icon-theme
              useradd -m builder
              chown -R builder /src
              su builder -c "cd /src/packaging/arch && makepkg --nodeps --noconfirm"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          if-no-files-found: error
          path: packaging/arch/*.pkg.tar.zst
