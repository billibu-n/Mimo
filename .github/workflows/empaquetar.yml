name: Empaquetar

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: empaquetar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (deb + rpm)
    runs-on: ubuntu-24.04
    environment: release
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio/src-tauri

      - name: Dependencias de Tauri y empaquetado
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev rpm gnupg

      - name: Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.0

      - name: Construir DEB y RPM
        working-directory: escritorio
        run: tauri build --bundles deb,rpm

      - name: Firmar RPM con GPG
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          PASSFILE=$(mktemp)
          WRAP=$(mktemp)
          LOG=$(mktemp)
          trap 'cat "$LOG" 2>/dev/null || true; rm -f "$PASSFILE" "$WRAP" "$LOG"' EXIT

          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "${RPM_GPG_PASSPHRASE%$'\n'}" > "$PASSFILE"
          chmod 600 "$PASSFILE"

          {
            echo '#!/bin/sh'
            printf 'echo "gpg-args: $*" >> %s\n' "$LOG"
            printf 'exec /usr/bin/gpg --batch --yes --pinentry-mode loopback --passphrase-file %s "$@"\n' "$PASSFILE"
          } > "$WRAP"
          chmod +x "$WRAP"

          FPR=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr:/{print $10; exit}')
          test -n "$FPR"
          echo "Firmando con $FPR"

          mkdir -p "$GNUPGHOME/rpmdb"
          gpg --armor --export "$FPR" > "$GNUPGHOME/pub.asc"
          rpmkeys --dbpath "$GNUPGHOME/rpmdb" --import "$GNUPGHOME/pub.asc"

          for rpm in escritorio/src-tauri/target/release/bundle/rpm/*.rpm; do
            rpmsign --addsign -D "__gpg $WRAP" -D "_gpg_name $FPR" -D "_gpg_path $GNUPGHOME" "$rpm"
            rpm --dbpath "$GNUPGHOME/rpmdb" --checksig -v "$rpm"
            rpm --dbpath "$GNUPGHOME/rpmdb" --checksig "$rpm" | grep -q ': OK'
          done

      - name: Regenerar firma del actualizador
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('escritorio/src-tauri/tauri.conf.json'))['version'])")
          echo "Version: $VERSION"

          if [ -f "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            KEY="$TAURI_SIGNING_PRIVATE_KEY"
          else
            KEY=$(mktemp)
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY"
          fi

          for rpm in escritorio/src-tauri/target/release/bundle/rpm/*.rpm; do
            rm -f "$rpm.sig"
            tauri signer sign -f "$KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              --app-version "$VERSION" "$rpm"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-rpm
          if-no-files-found: error
          path: |
            escritorio/src-tauri/target/release/bundle/deb/*.deb
            escritorio/src-tauri/target/release/bundle/deb/*.deb.sig
            escritorio/src-tauri/target/release/bundle/rpm/*.rpm
            escritorio/src-tauri/target/release/bundle/rpm/*.rpm.sig

  windows:
    name: Windows (NSIS x64)
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: escritorio/src-tauri

      - name: Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.0

      - name: Construir instalador NSIS
        working-directory: escritorio
        run: tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-x64
          if-no-files-found: error
          path: |
            escritorio/src-tauri/target/release/bundle/nsis/*.exe
            escritorio/src-tauri/target/release/bundle/nsis/*.exe.sig

  arch:
    name: Arch (PKGBUILD)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Construir paquete en Arch
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            archlinux:latest \
            bash -lc '
              set -e
              pacman -Syu --noconfirm --needed base-devel git rust cargo python pkgconf \
                webkit2gtk-4.1 gtk3 libsoup3 openssl cairo pango gdk-pixbuf2 \
                at-spi2-atk librsvg hicolor-icon-theme
              useradd -m builder
              chown -R builder /src
              su builder -c "cd /src/packaging/arch && makepkg --nodeps --noconfirm"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          if-no-files-found: error
          path: packaging/arch/*.pkg.tar.zst
